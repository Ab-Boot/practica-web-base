<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Práctica web — Informática III</title>
  </head>
  <body class="bg-gray-100 text-gray-800">


    <!-- EJERCICIO 1: construye aquí tu página (header, main con #catalogo, footer).
         Las instrucciones están en el README. -->
        <header>
          <div class="bg-blue-600 text-white text-center p-4 font-semibold">
            TALLER MORALES
            <h6>Los mejores en lo que hacemos!!!</h6>
          </div>
          <br>
        </header>

        <div class="flex flex-wrap justify-center gap-3 mb-4">

          <button data-categoria="Todos" class="btn-categoria bg-blue-600 text-white px-4 py-2 rounded shadow object-center">
            Todos
          </button>

          <button data-categoria="Afinacion" class="btn-categoria bg-blue-600 text-white px-4 py-2 rounded">
            Afinacion
          </button>

          <button data-categoria="Servicio" class="btn-categoria bg-blue-600 text-white px-4 py-2 rounded">
            Servicio
          </button>
        </div>

              <!--  EXTRA AGREGAR BUSCADOR  -->

    <div class="mb-6">

      <input
         id="buscador"
         type="text"
         placeholder="Buscar producto..."
         class="w-full max-w-md mx-auto block px-4 py-2 border rounded-lg
                 bg-white text-gray-900
                dark:bg-gray-800 dark:text-white
                dark:border-gray-600"
    >

    </div>



        
        <main class="max-w-6xl mx-auto p-6">
          <div id="catalogo" class=" grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          </div>

        <aside class="bg-white rounded-lg shadow p-6 mt-8">
          <h2 class="text-2xl font-bold mb-4">
              Mi pedido
          </h2>

          <ul id="lista-pedido" class="space-y-2 mb-4">
          </ul>

          <p id="total" class="text-xl font-bold mb-4">
              Total: $0
          </p>

          <button
              id="btn-vaciar"
              class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
              Vaciar pedido
          </button>

          <form id="form-cliente" class="mt-6 space-y-4">

  <!-- Nombre -->
  <div>
    <label for="nombre" class="block font-medium mb-1">
      Nombre
    </label>
    <input
      type="text"
      id="nombre"
      class="w-full border rounded-lg p-2"
      placeholder="Tu nombre"
    >
    <p id="error-nombre" class="text-sm text-red-600 hidden">
      El nombre es obligatorio.
    </p>
  </div>

  <!-- Teléfono -->
  <div>
    <label for="telefono" class="block font-medium mb-1">
      Teléfono
    </label>
    <input
      type="text"
      id="telefono"
      class="w-full border rounded-lg p-2"
      placeholder="10 dígitos"
    >
    <p id="error-telefono" class="text-sm text-red-600 hidden">
      El teléfono debe tener exactamente 10 dígitos.
    </p>
  </div>

  <!-- Correo -->
  <div>
    <label for="correo" class="block font-medium mb-1">
      Correo
    </label>
    <input
      type="text"
      id="correo"
      class="w-full border rounded-lg p-2"
      placeholder="correo@ejemplo.com"
    >
    <p id="error-correo" class="text-sm text-red-600 hidden">
      Ingresa un correo válido.
    </p>
  </div>

  <!-- Error del pedido -->
  <p id="error-pedido" class="text-sm text-red-600 hidden">
    El pedido no puede estar vacío.
  </p>

  <button
    type="submit"
    class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700"
  >
    Confirmar pedido
  </button>

</form>


        </aside>

        </main>
      
      
        <footer class="bg-gray-800 text-white text-center p-4 mt-8">
          <p>Equipo - Code Warriors (modelo lineal) </p>
        </footer>


    <script type="module" src="/src/main.js"></script>
  </body>
</html>
